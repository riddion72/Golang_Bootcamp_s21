global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'client'
    static_configs:
      - targets: ['client:8083']
  - job_name: 'frequency-server'
    static_configs:
      - targets: ['server:8082']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
rule_files:
  - /etc/prometheus/alerts.yml